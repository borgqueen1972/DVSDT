<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVSDT - Die verlorenen Seelen des Teufels</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1b1b1b 0%, #090909 55%, #000 100%);
      color: #fff;
      text-align: center;
    }
    main { width: min(1100px, 94%); padding: 40px 20px; }
    h1 {
      margin: 0;
      color: #a40000;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 7vw, 6rem);
      line-height: 1.08;
      text-shadow: 0 0 10px rgba(220,0,0,.45), 0 0 28px rgba(130,0,0,.35);
    }
    .dvsdt {
      margin-top: 20px;
      color: #c7c7c7;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.2rem, 3vw, 2rem);
      letter-spacing: .35em;
      padding-left: .35em;
    }
    .work {
      margin-top: 90px;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Die verlorenen Seelen des Teufels</h1>
    <div class="dvsdt">DVSDT</div>
    <div class="work">Seite in Arbeit</div>
  </main>
</body>
</html>
