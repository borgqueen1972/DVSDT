<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DVSDT</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #050505;
            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            font-family: Arial, sans-serif;
        }

        .content {
            text-align: center;
            margin-top: 8vh;
        }

        .logo {
            width: min(600px, 85vw);
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .text {
            margin-top: 40px;
            font-size: clamp(24px, 4vw, 42px);
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <main class="content">

        <img
            class="logo"
            src="bilder/DVSDTLogo.jpg"
            alt="DVSDT Logo"
        >

        <div class="text">
            Wir sind auf dem Weg zu euch
        </div>

    </main>

</body>
</html>
